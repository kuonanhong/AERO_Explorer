name = "aero-weather-reference"
main = "weather-worker.mjs"
compatibility_date = "2026-10-07"
workers_dev = false

# Replace this example with a custom domain in your own Cloudflare account.
# Cache API contents are local to each Cloudflare data center.
routes = [{ pattern = "weather.example.com", custom_domain = true }]

[vars]
# Origins only: scheme + hostname + optional port. Do not append a repo path.
ALLOWED_ORIGINS = "https://YOUR_USERNAME.github.io,https://aero.example.com"
# Free endpoint is NON-COMMERCIAL only; it still has request limits.
UPSTREAM_BASE = "https://api.open-meteo.com"
# Optional latMin,latMax,lonMin,lonMax boundary to reduce unrelated usage.
ALLOWED_BOUNDS = "21,26,119,123"

# For a licensed commercial plan, change UPSTREAM_BASE to
# "https://customer-api.open-meteo.com" and set the key via:
# npx wrangler secret put OPENMETEO_API_KEY
# Never put that key in this file, dist/config.js, HTML, Git, or logs.
